events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # Docker internal DNS resolver
        resolver 127.0.0.11 valid=10s;

        # Student page
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        # Staff page
        location /staff.html {
            root /usr/share/nginx/html;
        }

        # Proxy to menu-ms
        location /api/menu/ {
            set $menu_upstream http://menu-ms:8000;
            rewrite ^/api/menu/(.*) /$1 break;
            proxy_pass $menu_upstream;
        }

        # Proxy to orders-ms
        location /api/orders/ {
            set $orders_upstream http://orders-ms:8000;
            rewrite ^/api/orders/(.*) /$1 break;
            proxy_pass $orders_upstream;
        }
    }
}
